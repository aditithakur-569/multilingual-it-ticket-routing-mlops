name: Check project code

on:
  push:
    branches:
      - main
      - sam-aws-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-checks:
    name: Python syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check Python syntax
        run: python -m compileall -q src tests scripts

      - name: Check notebook syntax
        run: python scripts/check_notebooks.py

      - name: Run monitoring and inference tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
